AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deal Intelligence self-hosted Comp (GRC tool). Shared infrastructure:
  ECR repositories, evidence bucket, Aurora Serverless v2 (scale-to-zero),
  CodeBuild image builder, scoped IAM user for S3, and secrets placeholders.
  Application Lambdas + HTTP APIs are deployed by the Serverless Framework
  stacks in deploy/aws/{api,app,portal}.

Parameters:
  Project:
    Type: String
    Default: comp
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the database (default VPC is fine; subnets must be public)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different AZs
  DbMaxCapacity:
    Type: Number
    Default: 2
  DbSecondsUntilAutoPause:
    Type: Number
    Default: 600

Resources:
  # ---------------------------------------------------------------- ECR
  EcrApi:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-api'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  EcrApp:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-app'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  EcrPortal:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-portal'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  EcrApiWorker:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-api-worker'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
  EcrAppWorker:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-app-worker'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'
  EcrMigrator:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-migrator'
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  # ---------------------------------------------------------------- S3
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Project}-evidence-${AWS::AccountId}'
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['https://compliance.dealintelligence.io', 'https://compliance-portal.dealintelligence.io']
            AllowedHeaders: ['*']
            MaxAge: 3000
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-build-source-${AWS::AccountId}'
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7

  # ---------------------------------------------------------------- Database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${Project} aurora subnets'
      SubnetIds: !Ref SubnetIds
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${Project} aurora: TLS-only Postgres from Lambda and Trigger.dev workers'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Postgres (rds.force_ssl=1, password auth; see deploy/aws/README.md)
  DbClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: !Sub '${Project} aurora-postgresql16 force ssl'
      Family: aurora-postgresql16
      Parameters:
        rds.force_ssl: '1'
  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub '${Project}-db'
      Engine: aurora-postgresql
      EngineVersion: '16.11'
      EngineMode: provisioned
      DatabaseName: comp
      MasterUsername: comp
      ManageMasterUserPassword: true
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBClusterParameterGroupName: !Ref DbClusterParameterGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: 14
      DeletionProtection: true
      EnableCloudwatchLogsExports: [postgresql]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbSecondsUntilAutoPause
  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${Project}-db-1'
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: true

  # ---------------------------------------------------------------- App S3 user
  AppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${Project}-app-s3'
      Policies:
        - PolicyName: evidence-bucket-rw
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt EvidenceBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:GetObjectVersion]
                Resource: !Sub '${EvidenceBucket.Arn}/*'
  AppUserKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref AppUser
  AppUserKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/app-s3-user'
      SecretString: !Sub '{"APP_AWS_ACCESS_KEY_ID":"${AppUserKey}","APP_AWS_SECRET_ACCESS_KEY":"${AppUserKey.SecretAccessKey}"}'

  # Placeholder secrets filled by deploy/aws/secrets.sh (never committed).
  ApiEnvSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/env/api'
      SecretString: '{}'
  AppEnvSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/env/app'
      SecretString: '{}'
  PortalEnvSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/env/portal'
      SecretString: '{}'

  # ---------------------------------------------------------------- CodeBuild
  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/codebuild/${Project}'
      RetentionInDays: 90
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogs.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${SourceBucket.Arn}/*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt EcrApi.Arn
                  - !GetAtt EcrApp.Arn
                  - !GetAtt EcrPortal.Arn
                  - !GetAtt EcrMigrator.Arn
                  - !GetAtt EcrApiWorker.Arn
                  - !GetAtt EcrAppWorker.Arn
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref ApiEnvSecret
                  - !Ref AppEnvSecret
                  - !Ref PortalEnvSecret
                  - !GetAtt DbCluster.MasterUserSecret.SecretArn
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Project}-images'
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/source.zip'
        BuildSpec: deploy/aws/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref 'AWS::AccountId' }
          - { Name: PROJECT, Value: !Ref Project }
          - { Name: DB_MASTER_SECRET_ARN, Value: !GetAtt DbCluster.MasterUserSecret.SecretArn }
          - { Name: DB_HOST, Value: !GetAtt DbCluster.Endpoint.Address }
          - { Name: APP_ENV_SECRET, Value: !Ref AppEnvSecret }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref BuildLogs }
      TimeoutInMinutes: 60

Outputs:
  EcrApiUri: { Value: !GetAtt EcrApi.RepositoryUri }
  EcrAppUri: { Value: !GetAtt EcrApp.RepositoryUri }
  EcrPortalUri: { Value: !GetAtt EcrPortal.RepositoryUri }
  EcrMigratorUri: { Value: !GetAtt EcrMigrator.RepositoryUri }
  EvidenceBucket: { Value: !Ref EvidenceBucket }
  SourceBucket: { Value: !Ref SourceBucket }
  DbEndpoint: { Value: !GetAtt DbCluster.Endpoint.Address }
  DbMasterSecretArn: { Value: !GetAtt DbCluster.MasterUserSecret.SecretArn }
  AppUserKeySecret: { Value: !Ref AppUserKeySecret }
  BuildProject: { Value: !Ref BuildProject }
