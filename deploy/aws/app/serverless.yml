service: comp-app
frameworkVersion: '3'

custom:
  project: comp
  registry: ${aws:accountId}.dkr.ecr.${self:provider.region}.amazonaws.com
  imageTag: ${param:imageTag, 'latest'}
  hostedZoneId: ${param:hostedZoneId}
  rootDomain: dealintelligence.io
  fnLogicalId: App
  hostname: compliance.${self:custom.rootDomain}

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  architecture: x86_64
  deploymentMethod: direct
  versionFunctions: false
  logRetentionInDays: 90
  tags:
    Project: comp
    Owner: dealintelligence
    Purpose: grc-tooling
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [lambda:InvokeFunction]
          Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-worker

functions:
  app:
    image: ${self:custom.registry}/${self:custom.project}-app:${self:custom.imageTag}
    memorySize: 3008
    timeout: 120
    ephemeralStorageSize: 2048
    environment: ${file(../env.js):app}
    url: true

  worker:
    image: ${self:custom.registry}/${self:custom.project}-app-worker:${self:custom.imageTag}
    memorySize: 3008
    timeout: 900
    ephemeralStorageSize: 2048
    maximumRetryAttempts: 0
    environment: ${file(../env.js):appWorker}
    events: ${file(./schedules.yml):events}

resources:
  Resources: ${file(../common.yml):domainResources}
  Outputs:
    Url:
      Value: https://${self:custom.hostname}
