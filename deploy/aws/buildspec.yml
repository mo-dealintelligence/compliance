version: 0.2

# Builds the four images from deploy/Dockerfile and pushes them to ECR.
# Triggered by deploy/aws/build.sh (uploads a git archive to the source bucket).
# Env from the CodeBuild project: AWS_ACCOUNT_ID, PROJECT, DB_HOST,
# DB_MASTER_SECRET_ARN, APP_ENV_SECRET. Overrides per build: IMAGE_TAG,
# RUN_MIGRATIONS (true|false), SEED (true|false), TARGETS (space separated).

env:
  shell: bash
  variables:
    IMAGE_TAG: latest
    RUN_MIGRATIONS: 'false'
    SEED: 'false'
    TARGETS: 'migrator api api-worker app app-worker portal'
    DOCKER_BUILDKIT: '1'

phases:
  pre_build:
    commands:
      - export REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws || true
      - |
        # Build-time (NEXT_PUBLIC_*) values come from the app env secret so the
        # same inputs are used for every build.
        aws secretsmanager get-secret-value --secret-id "$APP_ENV_SECRET" --query SecretString --output text > /tmp/app-env.json
        python3 - <<'EOF'
        import json
        env = json.load(open('/tmp/app-env.json'))
        keys = [k for k in env if k.startswith('NEXT_PUBLIC_')]
        with open('/tmp/build-args', 'w') as f:
            for k in keys:
                f.write(f"{k}={env[k]}\n")
        print(f"{len(keys)} NEXT_PUBLIC_* build args")
        EOF
  build:
    commands:
      - |
        set -e
        mapfile -t NEXT_ARGS < /tmp/build-args
        for target in $TARGETS; do
          echo "==> building $target"
          docker build -f deploy/Dockerfile --target "$target" \
            --platform linux/amd64 \
            --cache-from "$REGISTRY/$PROJECT-$target:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            "${NEXT_ARGS[@]/#/--build-arg=}" \
            -t "$REGISTRY/$PROJECT-$target:$IMAGE_TAG" \
            -t "$REGISTRY/$PROJECT-$target:latest" .
          docker push "$REGISTRY/$PROJECT-$target:$IMAGE_TAG"
          docker push "$REGISTRY/$PROJECT-$target:latest"
        done
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "build failed; skipping migrations"; exit 1; fi
        if [ "$RUN_MIGRATIONS" = "true" ]; then
          echo "==> running migrations against $DB_HOST"
          PW=$(aws secretsmanager get-secret-value --secret-id "$DB_MASTER_SECRET_ARN" --query SecretString --output text | python3 -c 'import json,sys,urllib.parse; print(urllib.parse.quote(json.load(sys.stdin)["password"], safe=""))')
          docker run --rm \
            -e DATABASE_URL="postgresql://comp:${PW}@${DB_HOST}:5432/comp?sslmode=require" \
            -e SEED="$SEED" \
            "$REGISTRY/$PROJECT-migrator:$IMAGE_TAG"
        fi
      - echo "images pushed with tag $IMAGE_TAG"
