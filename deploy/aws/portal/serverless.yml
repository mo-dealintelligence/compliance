service: comp-portal
frameworkVersion: '3'

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  architecture: x86_64
  deploymentMethod: direct
  versionFunctions: false
  logRetentionInDays: 90
  tags:
    Project: comp
    Owner: dealintelligence
    Purpose: grc-tooling

custom:
  project: comp
  registry: ${aws:accountId}.dkr.ecr.${self:provider.region}.amazonaws.com
  imageTag: ${param:imageTag, 'latest'}
  hostedZoneId: ${param:hostedZoneId}
  rootDomain: dealintelligence.io
  fnLogicalId: Portal
  hostname: compliance-portal.${self:custom.rootDomain}

functions:
  portal:
    image: ${self:custom.registry}/${self:custom.project}-portal:${self:custom.imageTag}
    memorySize: 2048
    timeout: 120
    ephemeralStorageSize: 1024
    environment: ${file(../env.js):portal}
    url: true

resources:
  Resources: ${file(../common.yml):domainResources}
  Outputs:
    Url:
      Value: https://${self:custom.hostname}
