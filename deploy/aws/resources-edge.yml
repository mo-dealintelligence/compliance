# CloudFront in front of each Lambda Function URL (custom hostname + TLS) and
# the Route 53 alias records. Only in phase `all` (needs the functions).
infra: {}

all:
  Resources:
    AppDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.hosts.app}
          Aliases: ['${self:custom.hosts.app}']
          HttpVersion: http2and3
          PriceClass: PriceClass_100
          ViewerCertificate: { AcmCertificateArn: !Ref CertApp, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          Origins:
            - Id: lambda-url
              DomainName: !Select [2, !Split ['/', !GetAtt AppLambdaFunctionUrl.FunctionUrl]]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60 }
          DefaultCacheBehavior:
            TargetOriginId: lambda-url
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
    ApiDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.hosts.api}
          Aliases: ['${self:custom.hosts.api}']
          HttpVersion: http2and3
          PriceClass: PriceClass_100
          ViewerCertificate: { AcmCertificateArn: !Ref CertApi, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          Origins:
            - Id: lambda-url
              DomainName: !Select [2, !Split ['/', !GetAtt ApiLambdaFunctionUrl.FunctionUrl]]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60 }
          DefaultCacheBehavior:
            TargetOriginId: lambda-url
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
    PortalDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.hosts.portal}
          Aliases: ['${self:custom.hosts.portal}']
          HttpVersion: http2and3
          PriceClass: PriceClass_100
          ViewerCertificate: { AcmCertificateArn: !Ref CertPortal, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          Origins:
            - Id: lambda-url
              DomainName: !Select [2, !Split ['/', !GetAtt PortalLambdaFunctionUrl.FunctionUrl]]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60 }
          DefaultCacheBehavior:
            TargetOriginId: lambda-url
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
    AppDns:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: ${self:custom.hosts.app}
        Type: A
        AliasTarget: { DNSName: !GetAtt AppDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
    ApiDns:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: ${self:custom.hosts.api}
        Type: A
        AliasTarget: { DNSName: !GetAtt ApiDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
    PortalDns:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: ${self:custom.hosts.portal}
        Type: A
        AliasTarget: { DNSName: !GetAtt PortalDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
